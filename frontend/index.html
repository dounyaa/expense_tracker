<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <title>Expense Tracker</title>
</head>
<body>
    <h1 id="title">My Expense Tracker</h1>
    <form id="expense_form">
        <label>Amount<input type="number" id="amount" required></label>
        <label>Category<input type="text" id="category" required></label>
        <label>Description<input type="text" id="description" required></label>
        <input id="submit_btn" type="submit" value="Add Expense">
    </form>
    <ul id="list_expenses" ></ul>
</body>
</html>
